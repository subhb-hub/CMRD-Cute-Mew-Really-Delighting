[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmrd"
version = "0.1.0"
description = "Reproducible DE and RD baselines for cross-subject EEG emotion recognition"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "mne>=1.6",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
