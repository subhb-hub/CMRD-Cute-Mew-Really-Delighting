# Formal SEED LOSO experiment using hierarchical band/channel/time attention.
# Run from the repository root with:
#   python scripts/train_seed_de_rjsd_ica.py --config configs/seed/hierarchical_attention_rjsd.yaml

paths:
  # null uses Dataset/Processed/CMRD/seed/de_rjsd_ica_1s_hop05.
  data_root: null
  # null uses runs/seed/de_rjsd_ica.
  output_root: null

experiment:
  run_name: seed_rjsd_hierattn_d128_l3_seed42_monitor10
  feature: rjsd
  alpha: 0.5
  # null runs all 15 LOSO targets. For a smoke test use: [1]
  folds: null
  # For a multi-seed report use: [42, 3407, 2026]
  seeds: [42]

model:
  name: hierarchical_attention
  d_model: 128
  channel_heads: 4
  temporal_heads: 4
  temporal_layers: 3
  feedforward: 512
  dropout: 0.2

training:
  epochs: 80
  evaluation_interval: 10
  batch_size: 8
  learning_rate: 0.0001
  minimum_learning_rate: 0.000001
  weight_decay: 0.0001
  label_smoothing: 0.2
  gradient_clip_norm: 1.0

runtime:
  device: auto
  num_workers: 0
  pin_memory: true
  deterministic: true
  resume: true
  validate_only: false
  deep_validate: false
