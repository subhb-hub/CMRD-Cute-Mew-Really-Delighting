experiment:
  dataset: deap
  feature: rd
  model: hierarchical_attention
paths:
  data_root: ../Dataset
  processed_root: ../Dataset/Processed/CMRD
  run_root: runs
dataset:
  raw_dir: Ori/DEAP/data_original.zip
  label_file: Ori/DEAP/metadata_csv.zip
  label_target: quadrant
  channels: 32
  subjects: 32
  classes: 4
signal:
  original_rate: 512
  target_rate: 200
  broad_band_hz: [1.0, 75.0]
  filter_order: 4
  window_seconds: 1.0
  hop_seconds: 1.0
  bands_hz:
    delta: [1.0, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 14.0]
    beta: [14.0, 31.0]
    gamma: [31.0, 50.0]
feature:
  name: reference_deviation
  old_name: rjsd
  hist_bins_per_band: 32
  spectral_nfft: 512
  storage_dtype: float16
split:
  protocol: loso
  validation_subjects: 2
  seed: 42
model:
  d_model: 128
  nhead: 4
  layers: 3
  feedforward: 512
  dropout: 0.3
  hidden: 128
training:
  seeds: [42]
  device: auto
  deterministic: true
  epochs: 80
  batch_size: 16
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.001
  label_smoothing: 0.0
  early_stopping_patience: 12
  gradient_clip_norm: 1.0
  num_workers: 0
  pin_memory: true
tuning:
  seed: 42
  require_selection: true
  selection_file: ""
  architectures: []
  optimizations: []
output:
  save_checkpoints: true
